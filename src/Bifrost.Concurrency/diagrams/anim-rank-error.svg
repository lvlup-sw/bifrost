<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated illustration of rank error: a relaxed deleteMin sometimes leaves smaller keys behind; the expected stationary error is (5/6)·n − 1 + 1/(6n).">
  <!-- Looping SMIL, master cycle 11s. Three pops against the global ideal order:
       key 1 (error 0), key 4 (error 2: keys 2 and 3 left behind), key 3 (error 1).
       Error callouts appear only after the popped cell has faded, so nothing overlaps. -->

  <!-- caption band -->
  <g font-size="15" text-anchor="middle" fill="#8b949e">
    <text x="440" y="56" opacity="0">an ideal priority queue always removes the global minimum: rank error 0
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.045;0.26;0.29;1"/>
    </text>
    <text x="440" y="56" opacity="0">a relaxed deleteMin may skip smaller keys — this pop leaves 2 and 3 behind: rank error 2
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.345;0.58;0.61;1"/>
    </text>
    <text x="440" y="56" opacity="0">the leftovers are now the most attractive tops, so the next pops find them
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.64;0.665;0.93;1"/>
    </text>
  </g>

  <!-- the global ideal order: 12 cells, 56px wide, 8px gaps -->
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <!-- key 1: popped at ~1.2s, error 0 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -46; 0 -46; 0 0" keyTimes="0;0.109;0.2;0.99;1"/>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.164;0.218;0.99;1"/>
      <rect x="60" y="120" width="56" height="56" rx="7" fill="#3fb950" fill-opacity="0.22" stroke="#3fb950"/>
      <text x="88" y="155" fill="#3fb950">1</text>
    </g>
    <!-- key 2: stays; ringed when it is skipped -->
    <rect x="124" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/>
    <text x="152" y="155" fill="#8b949e">2</text>
    <rect x="120" y="116" width="64" height="64" rx="9" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
        values="0;0;0.9;0.9;0;0;0.9;0.9;0;0" keyTimes="0;0.4;0.43;0.58;0.61;0.682;0.71;0.818;0.85;1"/>
    </rect>
    <!-- key 3: ringed during pop of 4; itself popped at ~7.4s, error 1 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -46; 0 -46; 0 0" keyTimes="0;0.673;0.764;0.99;1"/>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.71;0.764;0.99;1"/>
      <rect x="188" y="120" width="56" height="56" rx="7" fill="#d29922" fill-opacity="0.18" stroke="#d29922"/>
      <text x="216" y="155" fill="#d29922">3</text>
    </g>
    <rect x="184" y="116" width="64" height="64" rx="9" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
        values="0;0;0.9;0.9;0;0" keyTimes="0;0.4;0.43;0.58;0.61;1"/>
    </rect>
    <!-- key 4: the relaxed pop at ~4.2s, error 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -46; 0 -46; 0 0" keyTimes="0;0.382;0.473;0.99;1"/>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.436;0.491;0.99;1"/>
      <rect x="252" y="120" width="56" height="56" rx="7" fill="#d29922" fill-opacity="0.18" stroke="#d29922"/>
      <text x="280" y="155" fill="#d29922">4</text>
    </g>
    <!-- keys 5..12, static -->
    <g fill="#8b949e">
      <rect x="316" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="344" y="155">5</text>
      <rect x="380" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="408" y="155">6</text>
      <rect x="444" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="472" y="155">7</text>
      <rect x="508" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="536" y="155">8</text>
      <rect x="572" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="600" y="155">9</text>
      <rect x="636" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="664" y="155">10</text>
      <rect x="700" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="728" y="155">11</text>
      <rect x="764" y="120" width="56" height="56" rx="7" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-opacity="0.5"/><text x="792" y="155">12</text>
    </g>
  </g>
  <text x="440" y="210" font-size="12" text-anchor="middle" fill="#8b949e">the queue's global ideal order — what a strict heap would return, left to right</text>

  <!-- error callouts, shown after each cell has faded -->
  <text x="88" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#3fb950" opacity="0">error 0
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.218;0.24;0.96;1"/>
  </text>
  <text x="280" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">error 2
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.491;0.513;0.96;1"/>
  </text>
  <text x="216" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">error 1
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.773;0.795;0.96;1"/>
  </text>

  <!-- running tally -->
  <text x="440" y="250" font-size="13" text-anchor="middle" fill="#8b949e">errors observed this round:
    <tspan fill="#3fb950" font-weight="bold" opacity="0">  0<animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.227;0.25;0.96;1"/></tspan>
    <tspan fill="#d29922" font-weight="bold" opacity="0">  · 2<animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.96;1"/></tspan>
    <tspan fill="#d29922" font-weight="bold" opacity="0">  · 1<animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.782;0.8;0.96;1"/></tspan>
  </text>

  <line x1="120" y1="278" x2="760" y2="278" stroke="#8b949e" stroke-opacity="0.3"/>

  <!-- the theory, static so it can be read at any point in the loop -->
  <text x="440" y="312" font-size="15" font-weight="bold" text-anchor="middle" fill="#58a6ff">E[rank error] = (5/6)·n − 1 + 1/(6n)   — exact stationary value (Walzer &amp; Williams, ESA 2025)</text>
  <text x="440" y="340" font-size="13" text-anchor="middle" fill="#8b949e">n = sub-queue count ≈ 4 × processor count. Two-choice sampling is load-bearing:</text>
  <text x="440" y="362" font-size="13" text-anchor="middle" fill="#8b949e">with single-choice deletion the error grows without bound (Alistarh et al., PODC 2017)</text>
  <text x="440" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922">the relaxation scales with the machine, not the workload: 8 cores (n = 32) pop from the top ≈ 27;</text>
  <text x="440" y="424" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922">64 cores (n = 256) from the top ≈ 213 — the identical binary. Never let correctness depend on rank.</text>
</svg>
