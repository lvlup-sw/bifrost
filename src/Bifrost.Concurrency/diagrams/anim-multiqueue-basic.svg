<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated walkthrough of the basic MultiQueue: enqueue locks one random sub-queue; deleteMin peeks two published tops without locking, then locks only the winner and pops it.">
  <!-- Looping SMIL, master cycle 14s. Every child animation uses dur=14s +
       repeatCount=indefinite with keyTimes as fractions of the cycle, so the scene
       stays synchronized across loops.
         0.3–3.6s   enqueue(27): one random sub-queue is locked, receives the item, unlocks
         4.2–9.4s   deleteMin: peek tops of Q1 and Q3 lock-free (8 < 12), lock Q3, pop 8
         10.2–13.4s the unsampled true minimum (3, in Q0) is highlighted: the relaxation -->

  <defs>
    <!-- padlock, open (gray): shackle swung aside -->
    <g id="lkO">
      <rect x="-9" y="0" width="18" height="13" rx="3" fill="none" stroke="#8b949e" stroke-width="2"/>
      <path d="M 1 0 V -5 A 5 5 0 0 1 11 -5 V -2" fill="none" stroke="#8b949e" stroke-width="2"/>
    </g>
    <!-- padlock, closed (red) -->
    <g id="lkC">
      <rect x="-9" y="0" width="18" height="13" rx="3" fill="#f85149"/>
      <path d="M -5 0 V -5 A 5 5 0 0 1 5 -5 V 0" fill="none" stroke="#f85149" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- ===== caption band (one caption at a time) ===== -->
  <g font-size="15" text-anchor="middle" fill="#8b949e">
    <text x="440" y="64" opacity="0">enqueue(27): pick one sub-queue at random, lock it, insert, unlock
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.04;0.23;0.26;1"/>
    </text>
    <text x="440" y="64" opacity="0">deleteMin: read TWO random published tops, no locks taken — 8 &lt; 12
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.47;0.5;1"/>
    </text>
    <text x="440" y="64" opacity="0">lock only the winner, pop its top, unlock
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.65;0.68;1"/>
    </text>
    <text x="440" y="64" opacity="0">the true minimum (3) wasn't sampled this round — it stays put and wins a later round
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.73;0.75;0.95;1"/>
    </text>
  </g>

  <!-- ===== actors ===== -->
  <text x="70" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#8b949e">producer</text>
  <text x="810" y="96" font-size="13" font-weight="bold" text-anchor="middle" fill="#8b949e">consumer</text>
  <text x="810" y="124" font-size="13" text-anchor="middle" fill="#3fb950" opacity="0">got: 8
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.61;0.63;0.95;1"/>
  </text>

  <!-- ===== four sub-queues: open-topped containers ===== -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M 110 140 V 334 H 210 V 140"/>
    <path d="M 290 140 V 334 H 390 V 140"/>
    <path d="M 470 140 V 334 H 570 V 140"/>
    <path d="M 650 140 V 334 H 750 V 140"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#8b949e">
    <text x="160" y="392">sub-queue 0</text>
    <text x="340" y="392">sub-queue 1</text>
    <text x="520" y="392">sub-queue 2</text>
    <text x="700" y="392">sub-queue 3</text>
  </g>

  <!-- published-top windows: a fixed blue frame at each queue's head -->
  <g stroke="#58a6ff" stroke-width="2" fill="none">
    <rect x="115" y="144" width="90" height="42" rx="6"/>
    <rect x="295" y="144" width="90" height="42" rx="6"/>
    <rect x="475" y="144" width="90" height="42" rx="6"/>
    <rect x="655" y="144" width="90" height="42" rx="6"/>
  </g>

  <!-- padlocks under each container -->
  <use href="#lkO" x="160" y="352"/>
  <use href="#lkO" x="340" y="352"/>
  <!-- Q2 lock: open except while inserting 27 (1.8–3.2s) -->
  <use href="#lkO" x="520" y="352">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;0.125;0.129;0.225;0.229;1"/>
  </use>
  <use href="#lkC" x="520" y="352" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.125;0.129;0.225;0.229;1"/>
  </use>
  <!-- Q3 lock: open except while popping 8 (7.0–8.8s) -->
  <use href="#lkO" x="700" y="352">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;0.496;0.5;0.625;0.629;1"/>
  </use>
  <use href="#lkC" x="700" y="352" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.496;0.5;0.625;0.629;1"/>
  </use>

  <!-- ===== queue contents (the minimum sits at the head, inside the blue window) ===== -->
  <!-- Q0: 3, 21, 40 -->
  <g>
    <rect x="118" y="146" width="84" height="38" rx="5" fill="#58a6ff" fill-opacity="0.16"/>
    <text x="160" y="171" font-size="17" font-weight="bold" text-anchor="middle" fill="#58a6ff">3</text>
    <rect x="118" y="190" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
    <text x="160" y="215" font-size="15" text-anchor="middle" fill="#8b949e">21</text>
    <rect x="118" y="234" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
    <text x="160" y="259" font-size="15" text-anchor="middle" fill="#8b949e">40</text>
  </g>
  <!-- Q1: 12, 19, 33 -->
  <g>
    <rect x="298" y="146" width="84" height="38" rx="5" fill="#58a6ff" fill-opacity="0.16"/>
    <text x="340" y="171" font-size="17" font-weight="bold" text-anchor="middle" fill="#58a6ff">12</text>
    <rect x="298" y="190" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
    <text x="340" y="215" font-size="15" text-anchor="middle" fill="#8b949e">19</text>
    <rect x="298" y="234" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
    <text x="340" y="259" font-size="15" text-anchor="middle" fill="#8b949e">33</text>
  </g>
  <!-- Q2: 14, 22 (+27 lands below during the enqueue) -->
  <g>
    <rect x="478" y="146" width="84" height="38" rx="5" fill="#58a6ff" fill-opacity="0.16"/>
    <text x="520" y="171" font-size="17" font-weight="bold" text-anchor="middle" fill="#58a6ff">14</text>
    <rect x="478" y="190" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
    <text x="520" y="215" font-size="15" text-anchor="middle" fill="#8b949e">22</text>
  </g>
  <!-- Q3: 8 at the head; 16/28 shift up one slot after the pop -->
  <g>
    <rect x="658" y="146" width="84" height="38" rx="5" fill="#58a6ff" fill-opacity="0.16">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.512;0.517;0.99;1"/>
    </rect>
    <text x="700" y="171" font-size="17" font-weight="bold" text-anchor="middle" fill="#58a6ff">8
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.512;0.517;0.99;1"/>
    </text>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -44; 0 -44; 0 0" keyTimes="0;0.607;0.655;0.99;1"/>
      <rect x="658" y="190" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
      <text x="700" y="215" font-size="15" text-anchor="middle" fill="#8b949e">16</text>
      <rect x="658" y="234" width="84" height="38" rx="5" fill="#8b949e" fill-opacity="0.12"/>
      <text x="700" y="259" font-size="15" text-anchor="middle" fill="#8b949e">28</text>
    </g>
  </g>

  <!-- ===== enqueue: random-pick flicker, then the 27 token flies into Q2 ===== -->
  <rect x="466" y="136" width="108" height="204" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.055;0.07;0.2;0.23;1"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.04;0.055;0.19;0.225;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="0 0; 0 0; 450 133; 450 133" keyTimes="0;0.07;0.185;1"/>
    <circle cx="70" cy="120" r="16" fill="#f0883e"/>
    <text x="70" y="125" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">27</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.18;0.2;0.96;1"/>
    <rect x="478" y="234" width="84" height="38" rx="5" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-opacity="0.6"/>
    <text x="520" y="259" font-size="15" text-anchor="middle" fill="#f0883e">27</text>
  </g>

  <!-- ===== deleteMin: peek rings on Q1 and Q3, then pop ===== -->
  <rect x="291" y="140" width="98" height="50" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.315;0.49;0.51;1"/>
  </rect>
  <rect x="651" y="140" width="98" height="50" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3;0.315;0.49;0.51;1"/>
  </rect>
  <!-- winner ring turns solid green while Q3 is locked -->
  <rect x="651" y="140" width="98" height="50" rx="8" fill="none" stroke="#3fb950" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.515;0.625;0.645;1"/>
  </rect>
  <!-- popped 8 flies to the consumer -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.51;0.52;0.6;0.62;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="0 0; 0 0; 110 -55; 110 -55" keyTimes="0;0.52;0.6;1"/>
    <rect x="658" y="146" width="84" height="38" rx="5" fill="#3fb950" fill-opacity="0.85"/>
    <text x="700" y="171" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
  </g>

  <!-- ===== relaxation: the unsampled true minimum ===== -->
  <text x="160" y="130" font-size="12" font-weight="bold" text-anchor="middle" fill="#f85149" opacity="0">the true min
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.74;0.76;0.94;1"/>
  </text>
  <rect x="111" y="140" width="98" height="50" rx="8" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;0.9;0.25;0.9;0.25;0.9;0;0" keyTimes="0;0.73;0.77;0.81;0.85;0.89;0.92;0.95;1"/>
  </rect>

  <!-- ===== footer ===== -->
  <g font-size="13" text-anchor="middle" fill="#8b949e">
    <text x="440" y="470">each sub-queue is an exact ordered heap behind a try-lock; the blue window is its published minimum, readable without taking the lock</text>
    <text x="440" y="496">with n ≈ 4 × processor count sub-queues and at most p threads holding locks, a free sub-queue always exists — a failed try-lock just resamples</text>
  </g>
  <text x="440" y="528" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922">deleteMin returns a small key, not always the smallest; the two-choice rule keeps that error small (see the rank-error figure)</text>
</svg>
