<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated illustration of the virtual-time priority key: an Interactive arrival is boosted 30 seconds back, passing fresh Batch work but never an item that has already waited longer than the window.">
  <!-- Looping SMIL, master cycle 11s. B1 (key 5) and B2 (key 20) sit on the virtual-time
       axis. I1 arrives at t=42, drops in, and slides back by the 30s boost to key 12:
       ahead of B2, never ahead of B1. -->

  <text x="440" y="34" font-size="15" font-weight="bold" text-anchor="middle" fill="#8b949e">priority key = enqueueTicks − classBoost · the smallest key dispatches first</text>

  <!-- caption band -->
  <g font-size="13" text-anchor="middle" fill="#8b949e">
    <text x="440" y="70" opacity="0">Batch has no boost: its key is just its arrival time
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1"/>
    </text>
    <text x="440" y="70" opacity="0">an Interactive item arriving at t = 42 is boosted 30 s back: key = 42 − 30 = 12
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.27;0.3;0.54;0.57;1"/>
    </text>
    <text x="440" y="70" opacity="0">dispatch order: B1, then I1, then B2 — Interactive passed only the fresh Batch item
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.625;0.755;0.78;1"/>
    </text>
    <text x="440" y="70" opacity="0">B1 has waited longer than the window: nothing fresh can pass it, whatever its class
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.8;0.825;0.96;1"/>
    </text>
  </g>

  <!-- boost bracket, in its own band above the items -->
  <g opacity="0">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.6;0.63;1"/>
    <line x1="678" y1="126" x2="262" y2="126" stroke="#58a6ff" stroke-width="2" stroke-dasharray="7 4"/>
    <polygon points="258,126 271,119 271,133" fill="#58a6ff"/>
    <text x="468" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#58a6ff">− 30 s boost (the window)</text>
  </g>

  <!-- dispatch-order markers, above each box -->
  <g font-size="13" font-weight="bold" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.625;0.755;0.78;1"/>
    <text x="160" y="198" fill="#f0883e">1st</text>
    <text x="258" y="198" fill="#58a6ff">2nd</text>
    <text x="370" y="198" fill="#f0883e">3rd</text>
  </g>

  <!-- aged-past-the-window highlight on B1 -->
  <text x="160" y="174" font-size="12" font-weight="bold" text-anchor="middle" fill="#3fb950" opacity="0">waited &gt; 30 s
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.81;0.835;0.95;1"/>
  </text>
  <rect x="118" y="208" width="84" height="52" rx="8" fill="none" stroke="#3fb950" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite"
      values="0;0;0.9;0.3;0.9;0.3;0.9;0;0" keyTimes="0;0.8;0.83;0.86;0.89;0.92;0.94;0.96;1"/>
  </rect>

  <!-- items: 76x44 boxes resting on the axis -->
  <!-- B1: key 5, center x=160 -->
  <g>
    <rect x="122" y="212" width="76" height="44" rx="6" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e"/>
    <text x="160" y="231" font-size="13" font-weight="bold" text-anchor="middle" fill="#f0883e">B1</text>
    <text x="160" y="247" font-size="11" text-anchor="middle" fill="#f0883e">key 5</text>
  </g>
  <!-- B2: key 20, center x=370 -->
  <g>
    <rect x="332" y="212" width="76" height="44" rx="6" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e"/>
    <text x="370" y="231" font-size="13" font-weight="bold" text-anchor="middle" fill="#f0883e">B2</text>
    <text x="370" y="247" font-size="11" text-anchor="middle" fill="#f0883e">key 20</text>
  </g>
  <!-- I1: arrives above t=42 (center 678), drops to the lane, slides to key 12 (center 258) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.27;0.3;0.96;1"/>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
      values="0 -68; 0 -68; 0 0; 0 0; -420 0; -420 0" keyTimes="0;0.28;0.33;0.39;0.52;1"/>
    <rect x="640" y="212" width="76" height="44" rx="6" fill="#58a6ff" fill-opacity="0.22" stroke="#58a6ff"/>
    <text x="678" y="231" font-size="13" font-weight="bold" text-anchor="middle" fill="#58a6ff">I1</text>
    <text x="678" y="247" font-size="11" text-anchor="middle" fill="#58a6ff">t = 42
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.5;0.53;0.99;1"/>
    </text>
    <text x="678" y="247" font-size="11" text-anchor="middle" fill="#58a6ff" opacity="0">key 12
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.96;1"/>
    </text>
  </g>

  <!-- the virtual-time axis -->
  <line x1="90" y1="270" x2="800" y2="270" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="800,270 789,264 789,276" fill="#8b949e"/>
  <g stroke="#8b949e">
    <line x1="90" y1="270" x2="90" y2="279"/><line x1="230" y1="270" x2="230" y2="279"/>
    <line x1="370" y1="270" x2="370" y2="279"/><line x1="510" y1="270" x2="510" y2="279"/>
    <line x1="650" y1="270" x2="650" y2="279"/><line x1="790" y1="270" x2="790" y2="279"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8b949e">
    <text x="90" y="296">0</text><text x="230" y="296">10</text><text x="370" y="296">20</text>
    <text x="510" y="296">30</text><text x="650" y="296">40</text><text x="790" y="296">50</text>
  </g>
  <text x="440" y="322" font-size="12" text-anchor="middle" fill="#8b949e">virtual time (the priority key) →</text>

  <!-- footer -->
  <text x="440" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#3fb950">an item older than the window outranks every fresh arrival, so the maximum overtake IS the window:</text>
  <text x="440" y="396" font-size="13" font-weight="bold" text-anchor="middle" fill="#3fb950">the starvation bound holds by construction — no aging scans, no escalation bookkeeping</text>
</svg>
