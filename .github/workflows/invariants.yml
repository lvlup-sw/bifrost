name: Invariant checks

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIFROST_INVARIANT_SEED_MULTIPLIER: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - name: Run invariant suites
        run: python3 scripts/run-invariant-tests.py
      - name: Check selected production mutations
        env:
          BIFROST_INVARIANT_SEED_MULTIPLIER: '1'
        run: |
          python3 scripts/invariants/queue-mutation-check.py
          python3 scripts/invariants/lifecycle-mutations.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: invariant-evidence
          retention-days: 30
          path: artifacts/invariants/
