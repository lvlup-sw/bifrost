name: CI

# Bifrost consumes the org composable CI layer (lvlup-sw/.github, #39): the
# build/test/coverage/AOT/benchmark logic lives in the org composite actions and
# reusable workflows, pinned to the v1.2 release SHA. Only bifrost-specific
# concerns stay here — the gated Stress proofs and the test-filter that keeps
# them out of the per-PR run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'ga'
  SOLUTION_PATH: 'src/Bifrost.sln'
  # Microsoft Testing Platform integration for .NET 10 + TUnit.
  DOTNET_CLI_TESTINGPLATFORM_ENABLE: '1'

jobs:
  build-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # MinVer needs full history/tags

      # Restore → build → run every test project with --coverage → merge via
      # ReportGenerator → upload the 'coverage-reports' artifact. The action
      # sets up .NET (reused by the smoke steps below in this job). test-filter
      # excludes the [Category=Stress] proofs, which run in the gated
      # stress-tests job — they starve/flake under --coverage on a 4-vcpu runner.
      - name: Build & test
        uses: lvlup-sw/.github/actions/dotnet-build-test@c0c3803d5c3e23c2d5ae2593ea9bc9c35096b47c # v1.5
        with:
          solution-path: ${{ env.SOLUTION_PATH }}
          test-project-patterns: src/Bifrost.Tests*/*.csproj
          test-filter: '/*/*/*/*[Category!=Stress]'
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}
          # Bifrost.Resilience enables EnableConfigurationBindingGenerator (BindConfiguration
          # in AddBifrostResilienceHandler), so a large BindingExtensions.g.cs is emitted. The
          # MTP --coverage collector does not honor the Coverlet ExcludeByFile/ExcludeByAttribute
          # props in src/Directory.Build.props, so the generated binder was polluting the
          # per-assembly gate (Bifrost.Resilience 46.67% branch). Opt into the action's
          # generated-code exclusion (--coverage-settings) to keep generated code out of the
          # denominator, restoring the intent the Coverlet props already declare.
          exclude-generated: 'true'

      # BenchmarkDotNet --job Dry: proves the benchmarks compile and execute.
      # Non-blocking (matches the pre-migration behavior).
      - name: Benchmark smoke
        continue-on-error: true
        uses: lvlup-sw/.github/actions/benchmark-smoke@f18b25baa238aa6b1f2331160cb7369a9d84b79e # v1.2
        with:
          benchmark-project: src/Bifrost.Benchmarks/Bifrost.Benchmarks.csproj
          filter: '*'

      # AOT smoke (DR-13): publish + run the scheduling sample as a NativeAOT
      # native binary. A non-zero exit fails the build (the intended gate).
      - name: AOT smoke (scheduling)
        uses: lvlup-sw/.github/actions/aot-smoke@f18b25baa238aa6b1f2331160cb7369a9d84b79e # v1.2
        with:
          project-path: samples/Bifrost.Scheduling.AotSmoke/Bifrost.Scheduling.AotSmoke.csproj

      # AOT smoke (CPQ DR-1): the buffered ConcurrentPriorityQueue reference-type
      # path (ESA 2021 §4 buffers) must be NativeAOT-clean. Distinct output-dir
      # so it doesn't clobber the scheduling publish above.
      - name: AOT smoke (concurrency)
        uses: lvlup-sw/.github/actions/aot-smoke@f18b25baa238aa6b1f2331160cb7369a9d84b79e # v1.2
        with:
          project-path: samples/Bifrost.Concurrency.AotSmoke/Bifrost.Concurrency.AotSmoke.csproj
          output-dir: ./aot-publish-concurrency

  stress-tests:
    name: Stress / churn proofs (heavy, gated)
    # The [Category=Stress] proofs (ConservationStressTests, ThreadChurnTests) are
    # multi-million-op conservation + multi-core thread-churn tests calibrated for a
    # >=4-core runner; they are excluded from the per-PR build-test run (they add
    # minutes and starve on small runners). Run them ONLY when needed: on every push
    # to main (post-merge correctness gate), on manual dispatch, and on PRs that carry
    # the 'run-stress' label. The correctness assertions themselves stay strict.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-stress')
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # MinVer needs full history/tags

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run Stress-category proofs
        # Target the project that carries the Stress tests directly: an MTP filter that
        # matches zero tests exits non-zero, so do not loop it over the stress-free projects.
        run: |
          dotnet run --project src/Bifrost.Tests.Concurrency --configuration Release -- \
            --treenode-filter "/*/*/*/*[Category=Stress]"

  coverage-gate:
    name: Coverage Gate
    # Per-assembly enforcement (#24): every shipping assembly (<package> in the
    # merged Cobertura report) must independently meet the threshold on BOTH line
    # and branch. The gate logic is the org shared script (upstreamed from the
    # former scripts/ci/coverage-gate.sh fork), internally SHA-pinned by the
    # reusable workflow.
    needs: build-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: lvlup-sw/.github/.github/workflows/coverage-gate.yml@f18b25baa238aa6b1f2331160cb7369a9d84b79e # v1.2
    with:
      coverage-threshold: 80
      gate-mode: per-assembly
      metrics: line+branch
      runner: blacksmith-4vcpu-ubuntu-2204
      dotnet-version: '10.0.x'

  update-baseline:
    name: Update Coverage Baseline
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: lvlup-sw/.github/.github/workflows/update-baseline.yml@c0c3803d5c3e23c2d5ae2593ea9bc9c35096b47c # v1.5
    with:
      runner: blacksmith-4vcpu-ubuntu-2204
      dotnet-version: '10.0.x'
