name: CI

# Bifrost consumes the org composable CI layer (lvlup-sw/.github), pinned at
# `@v1`. Never pin `@main`. This repo is the org canary-build-test fixture.
#
# Only bifrost-specific concerns stay here — the gated Stress proofs and the
# test-filter that keeps them out of the per-PR run. ci-lanes skips jobs whose
# paths a PR did not touch; every non-PR event runs every lane.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'ga'
  SOLUTION_PATH: 'src/Bifrost.sln'
  # Microsoft Testing Platform integration for .NET 10 + TUnit.
  DOTNET_CLI_TESTINGPLATFORM_ENABLE: '1'

jobs:
  plan:
    name: CI Lane Plan
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Checkout (full history, no file contents)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Plan lanes
        id: plan
        uses: lvlup-sw/.github/actions/ci-lanes@v1

  lanes-check:
    name: CI Lanes Check
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check lane contract
        uses: lvlup-sw/.github/actions/ci-lanes@v1
        with:
          mode: check

  build-test:
    name: Build & Test
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).build_test != 'false') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # MinVer needs full history/tags

      # Restore → build → run every test project with --coverage → merge via
      # ReportGenerator → upload the 'coverage-reports' artifact. The action
      # sets up .NET (reused by the smoke steps below in this job). test-filter
      # excludes the [Category=Stress] proofs, which run in the gated
      # stress-tests job — they starve/flake under --coverage on a 4-vcpu runner.
      - name: Build & test
