  stress-tests:
    name: Stress / churn proofs (heavy, gated)
    # The [Category=Stress] proofs (ConservationStressTests, ThreadChurnTests) are
    # multi-million-op conservation + multi-core thread-churn tests calibrated for a
    # >=4-core runner; they are excluded from the per-PR build-test run (they add
    # minutes and starve on small runners). ci-lanes runs them when the PR touches
    # this lane; every non-PR event (push to main, workflow_dispatch) runs every
    # lane, so main stays the post-merge correctness gate.
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).stress != 'false') }}
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # MinVer needs full history/tags

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run Stress-category proofs
        # Target the project that carries the Stress tests directly: an MTP filter that
        # matches zero tests exits non-zero, so do not loop it over the stress-free projects.
        run: |
          dotnet run --project src/Bifrost.Tests.Concurrency --configuration Release -- \
            --treenode-filter "/*/*/*/*[Category=Stress]"

  coverage-gate:
    name: Coverage Gate
    # Per-assembly enforcement (#24): every shipping assembly (<package> in the
    # merged Cobertura report) must independently meet the threshold on BOTH line
    # and branch. The gate logic is the org shared script (upstreamed from the
    # former scripts/ci/coverage-gate.sh fork), internally SHA-pinned by the
    # reusable workflow.
    needs: [plan, build-test]
    if: ${{ always() && github.event_name == 'pull_request' && needs.build-test.result != 'failure' && needs.build-test.result != 'cancelled' }}
    permissions:
      contents: read
      pull-requests: write
    uses: lvlup-sw/.github/.github/workflows/coverage-gate.yml@v1
    with:
      enabled: ${{ needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).build_test != 'false' }}
      coverage-threshold: 80
      gate-mode: per-assembly
      metrics: line+branch
      runner: blacksmith-4vcpu-ubuntu-2204
      dotnet-version: '10.0.x'

