# Hybrid release handoff. The controller-owned Buildkite pipeline lvlup-sw/bifrost-release
# (defined in lvlup-sw/.github, see infra/buildkite/bifrost/RELEASE.md there) classifies the
# v* tag, certifies the tagged commit, and builds the BifrostTestHooks=false binaries as the
# only compile before `dotnet pack --no-build`. Its last step dispatches this workflow.
#
# This workflow builds nothing. It trusts no input on its own: it binds the dispatch to the
# tag and commit in git, waits for the Buildkite build to pass, verifies the manifest and
# every package digest, and only then pushes with NuGet trusted publishing (OIDC).
# nuget.org's trusted-publishing policy matches this file name (publish.yml) and the
# nuget-publish environment, so neither may be renamed.
#
# Manual recovery, using the digest from the Buildkite build annotation:
#   gh workflow run publish.yml --ref <tag> -f tag=<tag> -f commit=<sha> \
#     -f buildkite_build_number=<n> -f buildkite_build_id=<uuid> -f manifest_sha256=<digest>

name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z or vX.Y.Z-prerelease)'
        required: true
        type: string
      commit:
        description: 'Full commit SHA the tag points to'
        required: true
        type: string
      buildkite_build_number:
        description: 'bifrost-release Buildkite build number'
        required: true
        type: string
      buildkite_build_id:
        description: 'bifrost-release Buildkite build UUID'
        required: true
        type: string
      manifest_sha256:
        description: 'SHA-256 of bifrost-release-manifest.json'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'ga'
  BUILDKITE_ORG: 'lvlup-sw'
  BUILDKITE_PIPELINE: 'bifrost-release'
  # Set to the bifrost-release pipeline UUID before this workflow is activated. The verifier
  # refuses to run while this is not a UUID.
  BUILDKITE_PIPELINE_ID: 'unset-bifrost-release-pipeline-uuid'

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget-publish
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.bind.outputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Inputs arrive through env only, never interpolated into the script.
      # grep reads all of rev-list's output: under pipefail, grep -q would exit
      # early and fail the pipeline with SIGPIPE on a long history.
      - name: Bind the dispatch to the release tag
        id: bind
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          BUILD_NUMBER: ${{ inputs.buildkite_build_number }}
          BUILD_ID: ${{ inputs.buildkite_build_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }

          core='(0|[1-9][0-9]*)'
          tag_expression="^v${core}\.${core}\.${core}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          uuid_expression='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$EVENT_NAME" == workflow_dispatch ]] || fail 'Only workflow_dispatch may publish.'
          [[ ${#TAG} -le 128 && "$TAG" =~ $tag_expression ]] || fail 'tag is not a release tag.'
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'commit must be a full lowercase SHA.'
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || fail 'buildkite_build_number is malformed.'
          [[ "$BUILD_ID" =~ $uuid_expression ]] || fail 'buildkite_build_id is malformed.'
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail 'manifest_sha256 is malformed.'

          version="${TAG#v}"
          if [[ "$version" == *-* ]]; then
            IFS='.' read -ra identifiers <<<"${version#*-}"
            for identifier in "${identifiers[@]}"; do
              [[ ! "$identifier" =~ ^0[0-9]+$ ]] || fail 'tag has a leading-zero prerelease identifier.'
            done
          fi

          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]] || fail "Dispatch ref $GITHUB_REF is not refs/tags/$TAG."
          [[ "$GITHUB_SHA" == "$COMMIT" ]] || fail 'The dispatched commit is not the commit input.'
          [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$COMMIT" ]] || fail 'The tag does not point to the commit input.'
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$COMMIT" ]] || fail 'The checkout is not the tagged commit.'
          git rev-list --first-parent origin/main | grep -Fx "$COMMIT" >/dev/null || fail 'The tagged commit is not on the first-parent history of main.'

          {
            echo "tag=$TAG"
            echo "tag_object=$(git rev-parse "refs/tags/$TAG")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Fetch and verify the certified packages
        env:
          BUILDKITE_RELEASE_READ_TOKEN: ${{ secrets.BUILDKITE_RELEASE_READ_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG_OBJECT: ${{ steps.bind.outputs.tag_object }}
          RELEASE_BUILD_NUMBER: ${{ inputs.buildkite_build_number }}
          RELEASE_BUILD_ID: ${{ inputs.buildkite_build_id }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PACKAGE_DIR: nupkgs
        run: python3 -I .github/scripts/verify-release-handoff.py

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./nupkgs/*.nupkg)
          [[ ${#packages[@]} -eq 9 ]] || { echo "::error::Expected 9 packages, found ${#packages[@]}." >&2; exit 1; }
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # Symbols are best effort, as before: a symbol-server failure must not fail a release
      # whose packages are already on nuget.org.
      - name: Push symbols
        shell: bash
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in ./nupkgs/*.snupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.publish.outputs.tag }}
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: false
