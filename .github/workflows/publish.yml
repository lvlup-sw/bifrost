name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'ga'
  SOLUTION_PATH: 'src/Bifrost.sln'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: nuget-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the exact release tag
        id: release-kind
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          core='(0|[1-9][0-9]*)'
          tag_expression="^${core}\.${core}\.${core}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          [[ "$RELEASE_TAG" == v* && "$version" =~ $tag_expression ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]
          if [[ "$version" == *-* ]]; then
            IFS='.' read -ra identifiers <<<"${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then exit 1; fi
            done
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run tests
        run: |
          for proj in src/Bifrost.Tests/*.csproj; do
            dotnet run --project "$proj" --configuration Release --no-build --no-restore
          done

      - name: Certify stable release
        if: steps.release-kind.outputs.stable == 'true'
        run: |
          set -euo pipefail
          for project in Bifrost.Tests.Scheduling Bifrost.Tests.Concurrency; do
            dotnet run --project "src/$project" -c Release --no-build --no-restore -- \
              --treenode-filter '/*/*/*/*[Category!=Stress]' --minimum-expected-tests 1
          done
          dotnet run --project src/Bifrost.Tests.Concurrency -c Release --no-build --no-restore -- \
            --treenode-filter '/*/*/*/*[Category=Stress]' --minimum-expected-tests 1
          BIFROST_INVARIANT_SEED_MULTIPLIER=4 python3 scripts/run-invariant-tests.py --skip-build
          python3 scripts/invariants/queue-mutation-check.py
          python3 scripts/invariants/lifecycle-mutations.py
      - name: Soak changes that affect the CPQ release workload
        if: steps.release-kind.outputs.stable == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous=''
          while IFS= read -r tag; do
            if [[ "$tag" != "$RELEASE_TAG" && "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              previous="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)
          if [[ -n "$previous" ]] && git diff --quiet "$previous" HEAD -- src/ global.json; then
            echo "No code, dependencies, or benchmark inputs changed since $previous."
          else
            dotnet run --project src/Bifrost.Benchmarks -c Release --no-build --no-restore -- \
              soak --seconds 600 --out soak-results
          fi

      - name: Certify scheduling NativeAOT
        if: steps.release-kind.outputs.stable == 'true'
        uses: ./.github/actions/aot-smoke-faf3b5c
        with:
          project-path: samples/Bifrost.Scheduling.AotSmoke/Bifrost.Scheduling.AotSmoke.csproj

      - name: Certify concurrency NativeAOT
        if: steps.release-kind.outputs.stable == 'true'
        uses: ./.github/actions/aot-smoke-faf3b5c
        with:
          project-path: samples/Bifrost.Concurrency.AotSmoke/Bifrost.Concurrency.AotSmoke.csproj
          output-dir: ./aot-publish-concurrency

      - name: Retain stable-release test evidence
        if: steps.release-kind.outputs.stable == 'true' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-proof-${{ github.sha }}
          path: |
            artifacts/invariants/
            soak-results/
          retention-days: 30

      - name: Build package artifact
        # Rebuild with BifrostTestHooks=false immediately before packing, so the BIFROST_TEST_HOOKS
        # test-only occupancy/routing/scan counters are stripped from the shipped binary. This MUST
        # be the last compile before `dotnet pack --no-build`: the test step above rebuilds
        # Bifrost.Concurrency with the default BifrostTestHooks=true, so packing right after it would
        # otherwise ship the instrumented binary.
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -p:BifrostTestHooks=false

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION_PATH }} --no-build --configuration Release --output ./nupkgs

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push symbols
        run: |
          for pkg in ./nupkgs/*.snupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        continue-on-error: true
