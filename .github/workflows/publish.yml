name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_QUALITY: 'preview'
  SOLUTION_PATH: 'src/Bifrost.sln'

jobs:
  publish:
    name: Build and Publish
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run tests
        run: |
          for proj in src/Bifrost.Tests/*.csproj; do
            dotnet run --project "$proj" --configuration Release
          done

      - name: Build package artifact
        # Rebuild with BifrostTestHooks=false immediately before packing, so the BIFROST_TEST_HOOKS
        # test-only occupancy/routing/scan counters are stripped from the shipped binary. This MUST
        # be the last compile before `dotnet pack --no-build`: the test step above rebuilds
        # Bifrost.Concurrency with the default BifrostTestHooks=true, so packing right after it would
        # otherwise ship the instrumented binary.
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release -p:BifrostTestHooks=false

      - name: Pack
        run: dotnet pack ${{ env.SOLUTION_PATH }} --no-build --configuration Release --output ./nupkgs

      - name: Push to NuGet
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push symbols
        run: |
          for pkg in ./nupkgs/*.snupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        continue-on-error: true
