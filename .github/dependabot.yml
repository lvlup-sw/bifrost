version: 2

updates:
  # Keep GitHub Actions pinned to commit SHAs (DR-1) fresh. Dependabot will open
  # PRs that bump each pinned SHA when the upstream action ships a new release,
  # updating both the 40-char SHA and the trailing `# vN` comment so the
  # supply-chain pins never silently rot.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - "type:dependencies"
      - "scope:ci"
