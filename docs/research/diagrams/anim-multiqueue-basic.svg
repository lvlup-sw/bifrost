<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated walkthrough of the basic MultiQueue algorithm: random-sub-queue enqueue and two-choice deleteMin">
  <!-- Looping SMIL animation, master cycle 14s. All child animations share dur=14s /
       repeatCount=indefinite with keyTimes expressed as fractions of the cycle, so the
       scene stays in sync on every loop. Phases:
         0.0–2.8s  enqueue(27) into one uniformly random sub-queue
         3.0–7.8s  deleteMin round 1: peek two random tops (8 vs 12), lock winner, pop 8
         8.2–13.2s deleteMin round 2: peek (14 vs 9), pop 9 — while the true global min (3)
                   sits unexamined in SQ-0: the relaxation made visible. -->

  <!-- ===== actors ===== -->
  <text x="115" y="40" font-size="13" text-anchor="middle" fill="#8b949e" font-weight="bold">producer</text>
  <text x="655" y="40" font-size="13" text-anchor="middle" fill="#8b949e" font-weight="bold">consumer</text>
  <text x="655" y="58" font-size="12" text-anchor="middle" fill="#3fb950" opacity="0">got: 8
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.51;0.53;0.95;1"/>
  </text>
  <text x="655" y="74" font-size="12" text-anchor="middle" fill="#3fb950" opacity="0">got: 9
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.82;0.84;0.95;1"/>
  </text>

  <!-- ===== phase captions ===== -->
  <g font-size="14" text-anchor="middle" fill="#8b949e">
    <text x="380" y="86" opacity="0">enqueue(27) — pick ONE sub-queue uniformly at random, try-lock it, insert
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.175;0.2;1"/>
    </text>
    <text x="380" y="86" opacity="0">deleteMin — peek the tops of TWO random sub-queues (no locks taken)
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.214;0.235;0.375;0.395;1"/>
    </text>
    <text x="380" y="86" opacity="0">lock only the winner of the comparison, pop its top
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.395;0.415;0.54;0.56;1"/>
    </text>
    <text x="380" y="86" opacity="0">round 2: neither sampled queue held the global min (3) — it simply waits, and ages
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.59;0.61;0.94;1"/>
    </text>
  </g>

  <!-- ===== six sub-queues =====
       column i: x = 60 + i*110 (w 90, center 105 + i*110)
       top slot y=120 h=34; stack items y=160/196/232 h=30 -->
  <g>
    <!-- static frames, labels -->
    <g font-size="12" text-anchor="middle" fill="#8b949e">
      <text x="105" y="288">SQ-0</text><text x="215" y="288">SQ-1</text><text x="325" y="288">SQ-2</text>
      <text x="435" y="288">SQ-3</text><text x="545" y="288">SQ-4</text><text x="655" y="288">SQ-5</text>
    </g>

    <!-- top slots (lock-free readable) -->
    <g stroke="#58a6ff" stroke-width="1.5">
      <rect x="60"  y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
      <rect x="170" y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
      <rect x="280" y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
      <rect x="390" y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
      <rect x="500" y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
      <rect x="610" y="120" width="90" height="34" rx="6" fill="#58a6ff" fill-opacity="0.16"/>
    </g>
    <g font-size="16" font-weight="bold" text-anchor="middle" fill="#58a6ff">
      <text x="105" y="142">3</text>
      <text x="215" y="142">12</text>
      <text x="325" y="142">14</text>
      <text x="435" y="142">17</text>
      <!-- SQ-4 top: 8 until popped at ~6.6s, then 16 -->
      <text x="545" y="142">8
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.42;0.43;1"/>
      </text>
      <text x="545" y="142" opacity="0">16
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.485;0.5;0.98;1"/>
      </text>
      <!-- SQ-5 top: 9 until popped at ~11.2s, then 11 -->
      <text x="655" y="142">9
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.73;0.74;1"/>
      </text>
      <text x="655" y="142" opacity="0">11
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;1" keyTimes="0;0.79;0.805;0.98;1"/>
      </text>
    </g>

    <!-- heap stacks below the tops -->
    <g fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.45">
      <rect x="60"  y="160" width="90" height="30" rx="4"/><rect x="60"  y="196" width="90" height="30" rx="4"/>
      <rect x="170" y="160" width="90" height="30" rx="4"/><rect x="170" y="196" width="90" height="30" rx="4"/>
      <rect x="280" y="160" width="90" height="30" rx="4"/><rect x="280" y="196" width="90" height="30" rx="4"/>
      <rect x="390" y="160" width="90" height="30" rx="4"/><rect x="390" y="196" width="90" height="30" rx="4"/>
      <rect x="500" y="160" width="90" height="30" rx="4"/>
      <rect x="610" y="160" width="90" height="30" rx="4"/><rect x="610" y="196" width="90" height="30" rx="4"/>
    </g>
    <g font-size="13" text-anchor="middle" fill="#8b949e">
      <text x="105" y="180">21</text><text x="105" y="216">40</text>
      <text x="215" y="180">19</text><text x="215" y="216">33</text>
      <text x="325" y="180">22</text>
      <text x="435" y="180">25</text><text x="435" y="216">31</text>
      <text x="655" y="180">11
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.78;0.8;1"/>
      </text>
      <text x="655" y="216">35</text>
    </g>
    <!-- SQ-4's "16" sits in the stack until it is promoted to the top slot -->
    <text x="545" y="180" font-size="13" text-anchor="middle" fill="#8b949e">16
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.475;0.49;1"/>
    </text>
  </g>

  <!-- ===== phase 1: enqueue(27) token flies from producer into SQ-2's stack ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.155;0.18;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="0 0; 0 0; 210 161; 210 161" keyTimes="0;0.045;0.15;1"/>
    <circle cx="115" cy="50" r="15" fill="#f0883e" fill-opacity="0.9"/>
    <text x="115" y="55" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">27</text>
  </g>
  <!-- 27 lands as a stack item in SQ-2 -->
  <rect x="280" y="196" width="90" height="30" rx="4" fill="#f0883e" fill-opacity="0.18" stroke="#f0883e" stroke-opacity="0.6" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.97;1"/>
  </rect>
  <text x="325" y="216" font-size="13" text-anchor="middle" fill="#f0883e" opacity="0">27
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.15;0.17;0.97;1"/>
  </text>

  <!-- ===== phase 2: round-1 peek outlines (SQ-1 vs SQ-4) ===== -->
  <rect x="166" y="115" width="98" height="44" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="5 3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.214;0.23;0.39;0.41;1"/>
  </rect>
  <rect x="496" y="115" width="98" height="44" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="5 3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.214;0.23;0.39;0.41;1"/>
  </rect>
  <text x="380" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">peek: 8 &lt; 12 → take SQ-4
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.27;0.29;0.5;0.52;1"/>
  </text>
  <!-- winner ring + lock pill on SQ-4 -->
  <rect x="496" y="115" width="98" height="44" rx="8" fill="none" stroke="#3fb950" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.395;0.41;0.53;0.55;1"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.395;0.41;0.52;0.54;1"/>
    <rect x="560" y="106" width="58" height="18" rx="9" fill="#f85149"/>
    <text x="589" y="119" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">locked</text>
  </g>
  <!-- popped 8 flies to the consumer -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.415;0.425;0.5;0.515;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="0 0; 0 0; 110 -88; 110 -88" keyTimes="0;0.43;0.5;1"/>
    <circle cx="545" cy="137" r="15" fill="#3fb950"/>
    <text x="545" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
  </g>

  <!-- ===== phase 3: round-2 peek outlines (SQ-2 vs SQ-5), true min ignored ===== -->
  <rect x="276" y="115" width="98" height="44" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="5 3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.615;0.73;0.75;1"/>
  </rect>
  <rect x="606" y="115" width="98" height="44" rx="8" fill="none" stroke="#d29922" stroke-width="2.5" stroke-dasharray="5 3" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.615;0.73;0.75;1"/>
  </rect>
  <text x="490" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">peek: 9 &lt; 14 → take SQ-5
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.64;0.655;0.79;0.81;1"/>
  </text>
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.715;0.8;0.82;1"/>
    <rect x="670" y="106" width="58" height="18" rx="9" fill="#f85149"/>
    <text x="699" y="119" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">locked</text>
  </g>
  <!-- popped 9 flies to the consumer -->
  <g opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.73;0.81;0.825;1"/>
    <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
      values="0 0; 0 0; 0 -82; 0 -82" keyTimes="0;0.735;0.805;1"/>
    <circle cx="655" cy="137" r="15" fill="#3fb950"/>
    <text x="655" y="142" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
  </g>
  <!-- pulsing ring on the unexamined true minimum in SQ-0 -->
  <rect x="56" y="115" width="98" height="44" rx="8" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
      values="0;0;0.9;0.25;0.9;0.25;0.9;0;0" keyTimes="0;0.6;0.64;0.68;0.72;0.76;0.8;0.92;1"/>
  </rect>
  <text x="105" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#f85149" opacity="0">true min
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.88;0.92;1"/>
  </text>

  <!-- ===== footer ===== -->
  <text x="380" y="330" font-size="12" text-anchor="middle" fill="#8b949e">each sub-queue is an exact heap behind a try-lock · its current minimum is published to a lock-free readable top slot</text>
  <text x="380" y="350" font-size="12" text-anchor="middle" fill="#8b949e">contention scatters across n sub-queues (n ≈ 4 × processor count) — no thread ever waits on a lock: if a try-lock fails, it just re-samples</text>
  <text x="380" y="382" font-size="12" text-anchor="middle" fill="#d29922" font-weight="bold">deleteMin returns a small key, not necessarily THE smallest — that relaxation is the price of scalability,</text>
  <text x="380" y="400" font-size="12" text-anchor="middle" fill="#d29922" font-weight="bold">and the two-choice rule is what keeps the error small and self-stabilizing</text>
</svg>
