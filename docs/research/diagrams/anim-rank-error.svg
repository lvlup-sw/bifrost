<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated illustration of rank error: a relaxed deleteMin may leave smaller keys behind, and the expected error is (5/6)·n">
  <!-- Looping SMIL, master cycle 10s. Three deleteMin operations against the global
       ideal order: pop 1 (rank error 0), pop 4 (rank error 2 — keys 2 and 3 left
       behind), pop 3 (rank error 1). Footer states the exact stationary expectation
       and the scales-with-the-machine caveat. -->

  <!-- phase captions -->
  <g font-size="14" text-anchor="middle" fill="#8b949e">
    <text x="380" y="56" opacity="0">deleteMin in an ideal priority queue removes the global minimum — rank error 0
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.29;0.33;1"/>
    </text>
    <text x="380" y="56" opacity="0">a relaxed deleteMin may skip past smaller keys — here 2 are left behind: rank error 2
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.37;0.63;0.66;1"/>
    </text>
    <text x="380" y="56" opacity="0">the leftovers become the next minima — errors stay small and self-correct
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.67;0.7;0.95;1"/>
    </text>
  </g>

  <!-- running tally -->
  <text x="80" y="96" font-size="13" text-anchor="start" fill="#8b949e">observed rank errors:</text>
  <text x="228" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#3fb950" opacity="0">0
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.97;1"/>
  </text>
  <text x="244" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#d29922" opacity="0">2
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.58;0.6;0.97;1"/>
  </text>
  <text x="260" y="96" font-size="13" font-weight="bold" text-anchor="start" fill="#d29922" opacity="0">1
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.84;0.86;0.97;1"/>
  </text>

  <!-- the global ideal order: keys 1..12 at x = 70 + i*53, y=130 -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <!-- key 1: popped at ~1.5–2.8s, error 0 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -42; 0 -42" keyTimes="0;0.15;0.26;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.2;0.28;0.98;1"/>
      <rect x="70" y="130" width="47" height="47" rx="6" fill="#3fb950" fill-opacity="0.25" stroke="#3fb950"/>
      <text x="93.5" y="160" fill="#3fb950">1</text>
    </g>
    <!-- key 2: stays; red ring during pop of 4 and pop of 3 -->
    <g>
      <rect x="123" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/>
      <text x="146.5" y="160" fill="#8b949e">2</text>
      <rect x="120" y="127" width="53" height="53" rx="8" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
          values="0;0;0.9;0.9;0;0;0.9;0.9;0;0" keyTimes="0;0.42;0.46;0.6;0.64;0.74;0.78;0.86;0.9;1"/>
      </rect>
    </g>
    <!-- key 3: red ring during pop of 4; itself popped at ~7–8.4s (error 1) -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -42; 0 -42" keyTimes="0;0.7;0.82;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.76;0.84;0.98;1"/>
      <rect x="176" y="130" width="47" height="47" rx="6" fill="#d29922" fill-opacity="0.2" stroke="#d29922"/>
      <text x="199.5" y="160" fill="#d29922">3</text>
    </g>
    <rect x="173" y="127" width="53" height="53" rx="8" fill="none" stroke="#f85149" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
        values="0;0;0.9;0.9;0;0" keyTimes="0;0.42;0.46;0.6;0.64;1"/>
    </rect>
    <!-- key 4: popped RELAXED at ~4–5.4s, error 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0; 0 0; 0 -42; 0 -42" keyTimes="0;0.4;0.52;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.46;0.54;0.98;1"/>
      <rect x="229" y="130" width="47" height="47" rx="6" fill="#d29922" fill-opacity="0.2" stroke="#d29922"/>
      <text x="252.5" y="160" fill="#d29922">4</text>
    </g>
    <!-- keys 5..12: static -->
    <g fill="#8b949e">
      <rect x="282" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="305.5" y="160">5</text>
      <rect x="335" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="358.5" y="160">6</text>
      <rect x="388" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="411.5" y="160">7</text>
      <rect x="441" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="464.5" y="160">8</text>
      <rect x="494" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="517.5" y="160">9</text>
      <rect x="547" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="570.5" y="160">10</text>
      <rect x="600" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="623.5" y="160">11</text>
      <rect x="653" y="130" width="47" height="47" rx="6" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.5"/><text x="676.5" y="160">12</text>
    </g>
  </g>
  <text x="380" y="206" font-size="12" text-anchor="middle" fill="#8b949e">← the queue's global ideal order (what a strict heap would return, left to right) →</text>

  <!-- per-pop error callouts -->
  <text x="93" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#3fb950" opacity="0">err 0
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2;0.23;0.31;0.34;1"/>
  </text>
  <text x="252" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">err 2
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.49;0.61;0.64;1"/>
  </text>
  <text x="199" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#d29922" opacity="0">err 1
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.76;0.79;0.9;0.93;1"/>
  </text>

  <!-- footer: the theory -->
  <text x="380" y="252" font-size="14" font-weight="bold" text-anchor="middle" fill="#58a6ff">E[rank error] = (5/6)·n − 1 + 1/(6n)   (exact stationary value — Walzer &amp; Williams, ESA 2025)</text>
  <text x="380" y="276" font-size="12" text-anchor="middle" fill="#8b949e">n = sub-queue count ≈ 4 × processor count · two-choice sampling is load-bearing:</text>
  <text x="380" y="294" font-size="12" text-anchor="middle" fill="#8b949e">single-choice deletion has unboundedly growing rank error (Alistarh et al., PODC 2017)</text>
  <text x="380" y="326" font-size="12" font-weight="bold" text-anchor="middle" fill="#d29922">the relaxation scales with the machine, not the workload: 8 cores (n=32) → pops land in the top ≈27;</text>
  <text x="380" y="344" font-size="12" font-weight="bold" text-anchor="middle" fill="#d29922">64 cores (n=256) → top ≈213 — running the identical binary. Never let correctness depend on rank.</text>
</svg>
