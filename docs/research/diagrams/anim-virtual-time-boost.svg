<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Animated illustration of Bifrost's virtual-time priority key: key = enqueueTicks minus classBoost, bounding overtake by the boost window">
  <!-- Looping SMIL, master cycle 10s. Two Batch items sit on the virtual-time axis at
       their enqueue times (key = t). An Interactive item arrives at t=40 and slides
       back by the 30s boost to key 10 — ahead of B2 (20) but NOT ahead of B1 (5),
       which has already waited longer than the boost window. -->

  <text x="380" y="34" font-size="15" font-weight="bold" text-anchor="middle" fill="#8b949e">priority key = enqueueTicks − classBoost   (smaller key dispatches first)</text>

  <!-- phase captions -->
  <g font-size="13" text-anchor="middle" fill="#8b949e">
    <text x="380" y="62" opacity="0">Batch items carry no boost: their key is simply their arrival time
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.21;0.25;1"/>
    </text>
    <text x="380" y="62" opacity="0">an Interactive item arriving at t=40 is boosted 30s back: key = 40 − 30 = 10
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.29;0.55;0.59;1"/>
    </text>
    <text x="380" y="62" opacity="0">dispatch order: B1 (5) → I1 (10) → B2 (20) — Interactive jumped the fresh Batch item only
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.79;0.83;1"/>
    </text>
    <text x="380" y="62" opacity="0">B1 has waited longer than the window — NOTHING fresh can pass it, of any class
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.84;0.87;0.97;1"/>
    </text>
  </g>

  <!-- virtual-time axis: t=0..50 mapped to x=80..680 (12 px per unit) -->
  <line x1="80" y1="220" x2="690" y2="220" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="690,220 681,215 681,225" fill="#8b949e"/>
  <g font-size="11" text-anchor="middle" fill="#8b949e">
    <text x="80" y="240">0</text><text x="200" y="240">10</text><text x="320" y="240">20</text>
    <text x="440" y="240">30</text><text x="560" y="240">40</text><text x="680" y="240">50</text>
  </g>
  <text x="380" y="262" font-size="12" text-anchor="middle" fill="#8b949e">virtual time (priority key) →</text>
  <g font-size="11" fill="#8b949e">
    <line x1="80" y1="215" x2="80" y2="225" stroke="#8b949e"/><line x1="200" y1="215" x2="200" y2="225" stroke="#8b949e"/>
    <line x1="320" y1="215" x2="320" y2="225" stroke="#8b949e"/><line x1="440" y1="215" x2="440" y2="225" stroke="#8b949e"/>
    <line x1="560" y1="215" x2="560" y2="225" stroke="#8b949e"/><line x1="680" y1="215" x2="680" y2="225" stroke="#8b949e"/>
  </g>

  <!-- B1: Batch, enqueued t=5 -> key 5 (x=140) -->
  <g>
    <rect x="105" y="172" width="70" height="34" rx="6" fill="#f0883e" fill-opacity="0.22" stroke="#f0883e"/>
    <text x="140" y="187" font-size="12" font-weight="bold" text-anchor="middle" fill="#f0883e">B1</text>
    <text x="140" y="201" font-size="10" text-anchor="middle" fill="#f0883e">key 5</text>
  </g>
  <!-- aged-past-window pulse on B1 -->
  <rect x="101" y="168" width="78" height="42" rx="8" fill="none" stroke="#3fb950" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      values="0;0;0.9;0.3;0.9;0.3;0.9;0;0" keyTimes="0;0.84;0.87;0.9;0.93;0.95;0.97;0.99;1"/>
  </rect>
  <text x="140" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#3fb950" opacity="0">waited &gt; 30s
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.85;0.88;0.97;1"/>
  </text>

  <!-- B2: Batch, enqueued t=20 -> key 20 (x=320) -->
  <g>
    <rect x="285" y="172" width="70" height="34" rx="6" fill="#f0883e" fill-opacity="0.22" stroke="#f0883e"/>
    <text x="320" y="187" font-size="12" font-weight="bold" text-anchor="middle" fill="#f0883e">B2</text>
    <text x="320" y="201" font-size="10" text-anchor="middle" fill="#f0883e">key 20</text>
  </g>

  <!-- I1: Interactive, arrives t=40 (x=560), slides to key 10 (x=200): translate -360 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.27;0.3;0.97;1"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
      values="0 -70; 0 -70; 0 0; 0 0; -360 0; -360 0" keyTimes="0;0.28;0.33;0.38;0.5;1"/>
    <rect x="525" y="116" width="70" height="34" rx="6" fill="#58a6ff" fill-opacity="0.25" stroke="#58a6ff"/>
    <text x="560" y="131" font-size="12" font-weight="bold" text-anchor="middle" fill="#58a6ff">I1</text>
    <text x="560" y="145" font-size="10" text-anchor="middle" fill="#58a6ff">arrives t=40</text>
  </g>
  <!-- key relabel once landed -->
  <text x="200" y="106" font-size="11" font-weight="bold" text-anchor="middle" fill="#58a6ff" opacity="0">key = 40 − 30 = 10
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.97;1"/>
  </text>
  <!-- boost bracket from x=560 back to x=200 at y=98 -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.37;0.4;0.62;0.66;1"/>
    <line x1="560" y1="92" x2="200" y2="92" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="200,92 211,86 211,98" fill="#58a6ff"/>
    <text x="380" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#58a6ff">− 30 s class boost (the window)</text>
  </g>

  <!-- dispatch-order readout -->
  <g font-size="12" font-weight="bold" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.63;0.79;0.83;1"/>
    <text x="140" y="296" fill="#f0883e">1st: B1</text>
    <text x="200" y="296" fill="#58a6ff" dx="60">2nd: I1</text>
    <text x="320" y="296" fill="#f0883e" dx="120">3rd: B2</text>
  </g>

  <!-- footer -->
  <text x="380" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#3fb950">overtake is capped at the boost window ⇒ the starvation bound holds by construction — no aging scans, no extra bookkeeping</text>
</svg>
