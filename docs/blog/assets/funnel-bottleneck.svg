<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg   { fill: oklch(0.985 0.005 255); }
    .ttl  { fill: oklch(0.30 0.03 265); }
    .fn   { fill: oklch(0.95 0.012 266); stroke: oklch(0.82 0.025 266); }
    .mut  { fill: oklch(0.58 0.02 262); }
    .muts { stroke: oklch(0.58 0.02 262); }
    .th   { fill: oklch(0.52 0.13 266); }
    .tok  { fill: oklch(0.52 0.13 266); }
    .onc  { fill: oklch(0.98 0.005 255); }
    .acc  { fill: oklch(0.62 0.19 27); }
    .accs { stroke: oklch(0.62 0.19 27); }
    .neck { fill: oklch(0.94 0.045 30); stroke: oklch(0.62 0.19 27); }
    .deep { fill: oklch(0.33 0.07 266); }
  </style>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#747a94"/>
    </marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#df523c"/>
    </marker>
  </defs>

  <rect class="bg" x="8" y="8" width="704" height="464" rx="16" fill="#f7f8fb" stroke="#e7e9f0" stroke-width="1"/>
  <text class="ttl" x="360" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2e40">Many threads, one lock</text>

  <!-- threads -->
  <g text-anchor="middle" font-size="15" font-weight="700">
    <rect class="th" x="40"  y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="80"  y="83" fill="#f7f8fb">T1</text>
    <rect class="th" x="152" y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="192" y="83" fill="#f7f8fb">T2</text>
    <rect class="th" x="264" y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="304" y="83" fill="#f7f8fb">T3</text>
    <rect class="th" x="376" y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="416" y="83" fill="#f7f8fb">T4</text>
    <rect class="th" x="488" y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="528" y="83" fill="#f7f8fb">T5</text>
    <rect class="th" x="600" y="58" width="80" height="38" rx="9" fill="#4c53c2"/><text class="onc" x="640" y="83" fill="#f7f8fb">T6</text>
  </g>

  <!-- converging arrows -->
  <g class="muts" stroke="#747a94" stroke-width="2" marker-end="url(#ah)">
    <line x1="80"  y1="98" x2="150" y2="116"/>
    <line x1="192" y1="98" x2="220" y2="116"/>
    <line x1="304" y1="98" x2="316" y2="116"/>
    <line x1="416" y1="98" x2="404" y2="116"/>
    <line x1="528" y1="98" x2="500" y2="116"/>
    <line x1="640" y1="98" x2="570" y2="116"/>
  </g>

  <!-- funnel -->
  <polygon class="fn" points="70,122 650,122 392,300 328,300" fill="#ebedf8" stroke="#b7bce2" stroke-width="1.5"/>

  <!-- tokens frozen mid-flight: many queued above, one passing the neck -->
  <g class="tok" fill="#4c53c2">
    <circle cx="250" cy="150" r="6.5"/>
    <circle cx="360" cy="150" r="6.5"/>
    <circle cx="470" cy="150" r="6.5"/>
    <circle cx="322" cy="226" r="6.5"/>
    <circle cx="398" cy="226" r="6.5"/>
    <circle cx="360" cy="334" r="6.5"/>
    <circle cx="360" cy="392" r="6.5"/>
  </g>

  <!-- lock neck -->
  <rect class="neck" x="326" y="300" width="68" height="70" rx="6" fill="#fbe1d8" stroke="#df523c" stroke-width="2.5"/>
  <path d="M348,330 C348,313 372,313 372,330" fill="none" stroke="#df523c" stroke-width="3" stroke-linecap="round"/>
  <rect class="acc" x="344" y="330" width="32" height="20" rx="3" fill="#df523c"/>
  <text class="acc" x="360" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#df523c">LOCK</text>

  <!-- single output -->
  <line class="muts" x1="360" y1="372" x2="360" y2="406" stroke="#747a94" stroke-width="2.5" marker-end="url(#ah)"/>
  <text class="mut" x="378" y="392" font-size="13" fill="#747a94" text-anchor="start">one operation at a time</text>

  <!-- heap -->
  <rect class="deep" x="276" y="412" width="168" height="46" rx="10" fill="#313763"/>
  <text class="onc" x="360" y="441" text-anchor="middle" font-size="15" font-weight="700" fill="#f7f8fb">binary heap</text>

  <!-- annotation -->
  <text class="acc" x="612" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#df523c">the bottleneck</text>
  <line class="accs" x1="590" y1="246" x2="398" y2="330" stroke="#df523c" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahr)"/>
</svg>
