<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="8" y="8" width="704" height="414" rx="16" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1"/>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">No coordination: everyone grabs the root at once</text>

  <!-- heap edges -->
  <g stroke="#9ca3af" stroke-width="2">
    <line x1="360" y1="248" x2="306" y2="316"/>
    <line x1="360" y1="248" x2="414" y2="316"/>
    <line x1="306" y1="316" x2="280" y2="378"/>
    <line x1="306" y1="316" x2="334" y2="378"/>
    <line x1="414" y1="316" x2="386" y2="378"/>
    <line x1="414" y1="316" x2="440" y2="378"/>
  </g>

  <!-- collision halo + spark at root -->
  <circle cx="360" cy="248" r="44" fill="#fecaca" opacity="0.55"/>
  <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
    <line x1="392" y1="248" x2="410" y2="248"/>
    <line x1="328" y1="248" x2="310" y2="248"/>
    <line x1="360" y1="216" x2="360" y2="198"/>
    <line x1="360" y1="280" x2="360" y2="298"/>
    <line x1="382" y1="226" x2="395" y2="213"/>
    <line x1="338" y1="226" x2="325" y2="213"/>
    <line x1="382" y1="270" x2="395" y2="283"/>
    <line x1="338" y1="270" x2="325" y2="283"/>
  </g>

  <!-- nodes -->
  <g text-anchor="middle">
    <circle cx="280" cy="378" r="15" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="280" y="383" font-size="12" font-weight="600" fill="#475569">9</text>
    <circle cx="334" cy="378" r="15" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="334" y="383" font-size="12" font-weight="600" fill="#475569">7</text>
    <circle cx="386" cy="378" r="15" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="386" y="383" font-size="12" font-weight="600" fill="#475569">8</text>
    <circle cx="440" cy="378" r="15" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1.5"/><text x="440" y="383" font-size="12" font-weight="600" fill="#475569">6</text>
    <circle cx="306" cy="316" r="21" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><text x="306" y="322" font-size="14" font-weight="700" fill="#374151">5</text>
    <circle cx="414" cy="316" r="21" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><text x="414" y="322" font-size="14" font-weight="700" fill="#374151">8</text>
    <circle cx="360" cy="248" r="27" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><text x="360" y="254" font-size="16" font-weight="700" fill="#dc2626">3</text>
  </g>

  <!-- threads -->
  <g text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">
    <rect x="36"  y="54" width="116" height="32" rx="8" fill="#2563eb"/><text x="94"  y="74">delete-min</text>
    <rect x="230" y="44" width="92"  height="32" rx="8" fill="#0891b2"/><text x="276" y="64">insert</text>
    <rect x="398" y="44" width="92"  height="32" rx="8" fill="#7c3aed"/><text x="444" y="64">insert</text>
    <rect x="568" y="54" width="116" height="32" rx="8" fill="#db2777"/><text x="626" y="74">delete-min</text>
  </g>

  <!-- arrows converging on the root (B and C cross) -->
  <g stroke="#6b7280" stroke-width="2.2" marker-end="url(#ah)">
    <line x1="110" y1="88" x2="338" y2="232"/>
    <line x1="290" y1="78" x2="374" y2="222"/>
    <line x1="430" y1="78" x2="348" y2="222"/>
    <line x1="616" y1="88" x2="384" y2="232"/>
  </g>
</svg>
